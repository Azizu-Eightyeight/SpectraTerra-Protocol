<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpectraTerra Protocol</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 { color: #38bdf8; margin: 0; }
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .module {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            width: 45%;
            min-height: 300px;
        }
        h2 { color: #f472b6; font-size: 1.2rem; }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <header>
        <h1>SpectraTerra Protocol</h1>
        <p>NASA SPHEREx Infrared Exploration & Terraform Simulation Lab</p>
    </header>

    <div class="container">
        <!-- Modül A: SpectraScan -->
        <div class="module">
            <h2>Modül A: SpectraScan (Blink Comparator)</h2>
            <p>Status: Ready to scan NASA infrared sky data...</p>
            <button onclick="alert('Scanning SPHEREx sky grid... Exoplanet candidate detected!')">Run Sky Scan</button>
        </div>

        <!-- Modül B: TerraProtocol -->
        <div class="module">
            <h2>Modül B: TerraProtocol (Climate Lab)</h2>
            <p>Status: No target loaded.</p>
            <label>Atmospheric Thickness:</label><br>
            <input type="range" min="0" max="100" value="50"><br><br>
            <button onclick="alert('Simulating planetary surface temperature...')">Run Terraform Simulation</button>
        </div>
    </div>

</body>
</html>
